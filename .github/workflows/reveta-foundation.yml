name: Reveta Foundation Checks

on:
  pull_request:
    paths:
      - "reveta_ecosystem/**"
      - "hermes_cli/web_routers/reveta.py"
      - "tests/test_reveta_foundation.py"
      - "tests/test_reveta_render_preview_boot.py"
      - "docker/render-preview-boot.sh"
      - "docker/entrypoint-dispatch.sh"
      - "tests/skills/test_reveta_ecosystem_skill.py"
      - "skills/productivity/reveta-ecosystem/**"
      - ".github/workflows/reveta-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-boundary-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install isolated test runner
        run: python -m pip install "pytest==8.4.2"
      - name: Compile Reveta modules
        run: python -m compileall -q reveta_ecosystem hermes_cli/web_routers/reveta.py
      - name: Validate governance and registry boundaries
        run: python -m pytest --noconftest -q tests/test_reveta_foundation.py tests/test_reveta_render_preview_boot.py tests/skills/test_reveta_ecosystem_skill.py
